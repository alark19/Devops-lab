
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f2f5;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 25px;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
        }
        input {
            padding: 10px;
            width: 65%;
        }
        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        li {
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>My To-Do List</h2>
        <input id="task" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>
        <ul id="list"></ul>
    </div>

    <script>
        function addTask() {
            let task = document.getElementById("task");
            if (task.value.trim() === "") return;

            let li = document.createElement("li");
            li.textContent = task.value;

            li.onclick = function() {
                li.remove();
            };

            document.getElementById("list").appendChild(li);
            task.value = "";
        }
    </script>
</body>
</html>
